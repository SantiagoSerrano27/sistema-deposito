spring.application.name=sistema-deposito

#Conexion a la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/deposito_db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate va a crear/actualizar las tablas automaticamente segun las clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Clave de desarrollo de 256 bits como respaldo. En producción, definir JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-only-sistema-deposito-jwt-secret-2026-strong-key}
jwt.expiration-ms=28800000
server.port=8080
